<!doctype html>
<html lang="pt-BR" data-theme="light" data-motion="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f0e8" />
    <meta
      name="description"
      content="Futeiro: futebol de escolhas. Craque, a carreira de jogador, e Técnico, a carreira de treinador."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Futeiro" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Futeiro: futebol de escolhas</title>
    <style>
      /* A abertura antes do jogo: a marca no centro, nas cores do tema. Some
         quando o jogo desenha a primeira tela. */
      .boot {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding: 24px;
        background: #0d1110;
        color: #9ca79f;
        font: 600 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      [data-theme="light"] .boot {
        background: #f3f0e8;
        color: #545d57;
      }
      .boot svg {
        display: block;
        width: 28px;
        height: 38px;
        margin: 0 auto 14px;
        color: currentColor;
      }
      .boot-error {
        display: none;
        max-width: 22rem;
      }
      .boot-error a {
        display: inline-flex;
        align-items: center;
        margin-top: 14px;
        min-height: 44px;
        padding: 0 20px;
        text-decoration: none;
        border: 0;
        border-radius: 4px;
        background: #e3b341;
        color: #0d1110;
        font: inherit;
        font-weight: 800;
        text-transform: uppercase;
        cursor: pointer;
      }
      .boot[data-failed] .boot-loading {
        display: none;
      }
      .boot[data-failed] .boot-error {
        display: block;
      }
    </style>
    <!-- Tema, idioma e proteção contra iframe antes da primeira pintura (D114: arquivo, não script embutido). -->
    <script src="/boot/tema.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div>
          <svg viewBox="0 0 24 32" aria-hidden="true" focusable="false" fill="none">
            <rect x="2" y="1.5" width="20" height="29" rx="1.5" stroke="currentColor" stroke-width="2.2" />
            <line x1="2" y1="16" x2="22" y2="16" stroke="currentColor" stroke-width="2.2" />
            <circle cx="12" cy="16" r="4.2" stroke="#e3b341" stroke-width="2.2" />
          </svg>
          <p class="boot-loading" data-boot="loading">Abrindo o Futeiro</p>
          <div class="boot-error">
            <p data-boot="failed">Não deu para abrir o jogo. Sua carreira continua salva; recarregue para tentar de novo.</p>
            <a href="" data-boot="reload">Recarregar</a>
          </div>
        </div>
      </div>
    </div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">O Futeiro precisa de JavaScript ligado para jogar.</p>
    </noscript>
    <script src="/boot/abertura.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
