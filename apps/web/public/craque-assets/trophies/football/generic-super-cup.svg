<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 210" width="120" height="210">
  <!--
    Stand-in artwork for the super cups, which the asset set never shipped.
    Drawn as a salver on a plinth rather than a cup so it reads as a different
    competition at a glance, in the same gold as generic-cup.svg.
  -->
  <defs>
    <linearGradient id="sc-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A77B34"/>
      <stop offset="0.25" stop-color="#F9B54F"/>
      <stop offset="0.72" stop-color="#F9B54F"/>
      <stop offset="1" stop-color="#B58538"/>
    </linearGradient>
    <linearGradient id="sc-gold-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C6529"/>
      <stop offset="0.3" stop-color="#D89F43"/>
      <stop offset="0.75" stop-color="#D89F43"/>
      <stop offset="1" stop-color="#96702E"/>
    </linearGradient>
  </defs>

  <!-- Plinth -->
  <rect x="34" y="188" width="52" height="16" rx="4" fill="url(#sc-gold-dark)"/>
  <rect x="42" y="176" width="36" height="14" rx="3" fill="url(#sc-gold)"/>

  <!-- Stem -->
  <path d="M52 132 h16 v46 h-16 z" fill="url(#sc-gold-dark)"/>

  <!-- Salver -->
  <ellipse cx="60" cy="86" rx="52" ry="52" fill="url(#sc-gold)"/>
  <ellipse cx="60" cy="86" rx="42" ry="42" fill="none" stroke="#8C6529" stroke-width="3" opacity="0.55"/>
  <ellipse cx="60" cy="86" rx="31" ry="31" fill="url(#sc-gold-dark)"/>

  <!-- Star at the centre, the only mark that says "champion of champions" -->
  <path d="M60 66 L66.6 79.4 L81.4 81.6 L70.7 92 L73.2 106.7 L60 99.8 L46.8 106.7 L49.3 92 L38.6 81.6 L53.4 79.4 Z"
        fill="#FFDF8A"/>

  <!-- Ribbon tails -->
  <path d="M46 132 l-10 30 12 -6 6 10 6 -34 z" fill="url(#sc-gold-dark)" opacity="0.9"/>
  <path d="M74 132 l10 30 -12 -6 -6 10 -6 -34 z" fill="url(#sc-gold-dark)" opacity="0.9"/>
</svg>
